# Lefthook configuration for changelog automation
# Reference: https://lefthook.dev/

# Global settings
fail: stage

# Pre-commit hooks
pre-commit:
  parallel: true
  commands:
    branch-validate:
      glob: "sub-skills/branch-context-mapper/**"
      description: "Validate branch naming conventions"
      run: |
        if git rev-parse --verify HEAD >/dev/null 2>&1; then
          branch=$(git rev-parse --abbrev-ref HEAD)
          if ! printf '%s\n' "$branch" | grep -Eq '^(feature|feat|fix|hotfix|docs|refactor|test|chore|security|perf|ci|build|deps|design|a11y|task|release)/[^/]*$' && [ "$branch" != "main" ] && [ "$branch" != "master" ] && [ "$branch" != "develop" ]; then
            echo "❌ Invalid branch name: $branch"
            echo "Must follow: type/description (feature/, feat/, fix/, hotfix/, docs/, refactor/, test/, chore/, security/, perf/, ci/, build/, deps/, design/, a11y/, task/, release/)"
            exit 1
          fi
          echo "✓ Branch naming valid: $branch"
        fi

    changelog-validate:
      glob: "CHANGELOG.md"
      description: "Validate changelog format"
      run: |
        # Basic format check of the real root CHANGELOG.md (not the fixture unit tests).
        # Diagnostics are printed and the validator's exit status is propagated.
        node scripts/validate-changelog.cjs CHANGELOG.md
        status=$?
        if [ "$status" -eq 0 ]; then
          echo "✓ CHANGELOG.md passed the basic format check"
        else
          echo "❌ CHANGELOG.md failed the basic format check - see errors above"
          exit "$status"
        fi

    vitest-tests:
      glob: "**/__tests__/*.test.{js,ts}"
      description: "Run all Vitest tests once (single run, no watch)"
      run: |
        # One run covers the root package and both sub-skills; a failing test fails the hook.
        # Coverage is reported (text, json-summary, lcov) and the 80% global threshold is enforced.
        npm run test:vitest --silent
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "❌ Vitest tests or the coverage threshold failed"
          exit "$status"
        fi
        echo "✓ Vitest tests passed"

    bats-tests:
      glob: "sub-skills/**/tests/**/*.bats"
      description: "Run BATS integration tests"
      run: |
        echo "Running BATS shell tests (100% pass rate required)..."
        cd sub-skills/branch-context-mapper && npm run test:bats
        if [ $? -ne 0 ]; then
          echo "❌ branch-context-mapper BATS failed"
          exit 1
        fi
        
        cd ../changelog-validator && npm run test:bats
        if [ $? -ne 0 ]; then
          echo "❌ changelog-validator BATS failed"
          exit 1
        fi
        echo "✓ All BATS tests passed"

# Commit message validation
commit-msg:
  commands:
    commit-format:
      description: "Validate commit message format"
      run: |
        commit_msg=$(cat "{1}")
        first_line=$(printf '%s\n' "$commit_msg" | head -n 1)
        if ! printf '%s\n' "$first_line" | grep -Eq '^[a-z]+(\([a-z-]+\))?:' && ! printf '%s\n' "$first_line" | grep -Eq '^Merge'; then
          echo "❌ Commit message must follow format: type(scope): message"
          echo "Examples:"
          echo "  - feat(branch-mapper): add breaking change detection"
          echo "  - fix(validator): resolve governance rule check"
          echo "  - docs: update architecture guide"
          echo "  - test(coverage): add edge case tests"
          exit 1
        fi
        echo "✓ Commit message format valid"

# Pre-push validation
pre-push:
  parallel: false
  commands:
    final-validation:
      description: "Final validation before push"
      run: |
        echo "Running final validation before push..."
        
        # Root package: all Vitest tests and the root BATS suite
        npm test --silent || exit 1

        # Sub-skill packages: lint and BATS (their Vitest tests already ran above)
        (cd sub-skills/branch-context-mapper && npm run lint --silent && npm run test:bats --silent) || exit 1
        (cd sub-skills/changelog-validator && npm run lint --silent && npm run test:bats --silent) || exit 1
        
        echo "✓ All tests passed - ready to push"
        echo "✓ Push will proceed"

# Installation
# Run: lefthook install

# Testing hooks
# Run: lefthook run pre-commit --all-files

# Documentation
# See: docs/HOOKS_GUIDE.md
